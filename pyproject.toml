[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "feenion"
version = "0.1.2"
description = "Open-source, self-hosted AI debugging and observability engine for LLMs, RAG, and autonomous agents."
readme = "README.md"
license = { text = "Apache-2.0" }
requires-python = ">=3.10"
authors = [
    { name = "Darshan", email = "hello@feenion.fun" }
]
keywords = [
    "ai",
    "llm",
    "observability",
    "tracing",
    "debugging",
    "rag",
    "agents",
    "opentelemetry",
    "langchain",
    "openai",
    "anthropic",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Bug Tracking",
    "Topic :: Software Development :: Quality Assurance",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

dependencies = [
    "pydantic>=2.0.0",
    "pydantic-settings>=2.0.0",
    "requests>=2.28.0",
]

[project.optional-dependencies]
server = [
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.30.0",
    "sqlalchemy>=2.0.0",
]
postgres = [
    "asyncpg>=0.29.0",
    "psycopg2-binary>=2.9.0",
]
redis = [
    "redis>=5.0.0",
]
gemini = [
    "google-genai>=0.1.0",
]
openai = [
    "openai>=1.0.0",
]
azure = [
    "openai>=1.0.0",
]
anthropic = [
    "anthropic>=0.18.0",
]
langchain = [
    "langchain-core>=0.1.0",
]
all = [
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.30.0",
    "sqlalchemy>=2.0.0",
    "asyncpg>=0.29.0",
    "redis>=5.0.0",
    "google-genai>=0.1.0",
    "openai>=1.0.0",
    "anthropic>=0.18.0",
    "langchain-core>=0.1.0",
]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "httpx>=0.27.0",
    "build>=1.0.0",
    "twine>=5.0.0",
    "ruff>=0.4.0",
]

[project.urls]
Homepage = "https://feenion.fun"
Documentation = "https://feenion.fun/docs"
Repository = "https://github.com/DarshanAguru/feenion.git"
Issues = "https://github.com/DarshanAguru/feenion/issues"
Changelog = "https://github.com/DarshanAguru/feenion/releases"

[project.scripts]
feenion-server = "feenion_server.main:start"

[tool.setuptools.packages.find]
where = ["sdk", "server"]

[tool.setuptools.package-data]
feenion = ["py.typed"]
