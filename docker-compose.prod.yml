version: '3.8'

services:
  api:
    build:
      context: .
      dockerfile: docker/Dockerfile.api
    ports:
      - "8000:8000"
    environment:
      - FEENION_DATABASE_URL=postgresql://feenion:feenion_secret@postgres:5432/feenion_db
      - FEENION_REDIS_URL=redis://redis:6379/0
      - FEENION_LOG_LEVEL=INFO
      - FEENION_RETENTION_DAYS=30
    depends_on:
      - postgres
      - redis

  worker:
    build:
      context: .
      dockerfile: docker/Dockerfile.worker
    environment:
      - FEENION_DATABASE_URL=postgresql://feenion:feenion_secret@postgres:5432/feenion_db
      - FEENION_REDIS_URL=redis://redis:6379/0
    depends_on:
      - postgres
      - redis

  web:
    build:
      context: .
      dockerfile: docker/Dockerfile.web
    ports:
      - "3000:80"
    depends_on:
      - api

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: feenion
      POSTGRES_PASSWORD: feenion_secret
      POSTGRES_DB: feenion_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

volumes:
  postgres_data:
  redis_data:

